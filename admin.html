.<!DOCTYPE html>
<html>
<head>
<title>REAL PESKY ADMIN PANEL</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

header{
    text-align:center;
    padding:20px;
    background:#1e293b;
    border-bottom:2px solid gold;
}

.login-box, .container{
    width:90%;
    max-width:500px;
    margin:40px auto;
    padding:20px;
    background:#1e293b;
    border-radius:12px;
}

.container{
    display:none;
}

input, textarea, select, button{
    width:100%;
    margin:10px 0;
    padding:10px;
    border-radius:8px;
    border:none;
}

button{
    background:gold;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>REAL PESKY ADMIN PANEL</h1>
</header>

<!-- LOGIN -->
<div class="login-box">
<h2>Admin Login</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="loginUser()">Login</button>
</div>

<!-- PANEL -->
<div class="container" id="panel">
    <a href="visitor.html">
  <button>📊 View Visitor Analytics</button>
</a>


<h2>Create Post</h2>

<input type="text" id="title" placeholder="Title">
<textarea id="desc" placeholder="Description"></textarea>

<select id="category">
<option>Football News</option>
<option>Transfer News</option>
<option>Match Highlights</option>
</select>

<input type="file" id="imageFile" accept="image/*">
<input type="file" id="videoFile">

<button id="publishBtn" onclick="createPost()">Publish Post</button>


<div class="card">
<h2>Edit Post</h2>

<select id="editSelect"></select>
<input type="text" id="editTitle" placeholder="Update Title">
<textarea id="editDesc" placeholder="Update Description"></textarea>

<button onclick="updatePost()">Update Post</button>
</div>

<div class="card">
<h2>Delete Post</h2>

<select id="deleteSelect"></select>

<button onclick="deletePost()">Delete Post</button>
</div>
</div>



<script>
/* ================= FIREBASE CONFIG (FIXED) ================= */
const firebaseConfig = {
  apiKey: "AIzaSyChAU1MnZxKB0PPdRZLaWvEWXkqYDl-qKU",
  authDomain: "real-pesky.firebaseapp.com",
  projectId: "real-pesky",
  storageBucket: "real-pesky.appspot.com",   // ✅ FIXED IMPORTANT
  messagingSenderId: "629793050464",
  appId: "1:629793050464:web:30fe462acfe0e71c605805"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const storage = firebase.storage();
</script>

<script>
/* LOGIN */
function loginUser(){

firebase.auth().signInWithEmailAndPassword(
    document.getElementById("email").value,
    document.getElementById("password").value
)
.then(() => {
    alert("Login successful");
    document.querySelector(".login-box").style.display = "none";
    document.getElementById("panel").style.display = "block";
})
.catch(err => alert(err.message));

}
</script>

<script>
/* ================= CREATE POST (FULL FIXED) ================= */

</script>

<script>
function createPost() {

const title = document.getElementById("title").value.trim();
const desc = document.getElementById("desc").value.trim();
const category = document.getElementById("category").value;
const imageFile = document.getElementById("imageFile").files[0];

const btn = document.getElementById("publishBtn");

if (!title || !desc) {
    alert("Fill title and description");
    return;
}

if (!imageFile) {
    alert("Select image");
    return;
}

btn.innerText = "Publishing...";
btn.disabled = true;

// Convert image to BASE64
const reader = new FileReader();

reader.readAsDataURL(imageFile);

reader.onload = function () {

    const base64Image = reader.result;

    db.collection("posts").add({
        title: title,
        description: desc,
        category: category,
        image: base64Image,
        likes: 0,
        time: firebase.firestore.FieldValue.serverTimestamp()
    })
    .then(() => {

        alert("Post published successfully!");

        document.getElementById("title").value = "";
        document.getElementById("desc").value = "";
        document.getElementById("imageFile").value = "";

        btn.innerText = "Publish Post";
        btn.disabled = false;

    })
    .catch(err => {

        alert("Error: " + err.message);

        btn.innerText = "Publish Post";
        btn.disabled = false;

    });

};

}

function loadPosts() {

db.collection("posts")
.orderBy("time", "desc")
.onSnapshot(snapshot => {

    let editHTML = "";
    let deleteHTML = "";

    snapshot.forEach(doc => {

        let post = doc.data();

        editHTML += `<option value="${doc.id}">${post.title}</option>`;
        deleteHTML += `<option value="${doc.id}">${post.title}</option>`;

    });

    document.getElementById("editSelect").innerHTML = editHTML;
    document.getElementById("deleteSelect").innerHTML = deleteHTML;

});

}

function updatePost() {

let id = document.getElementById("editSelect").value;

db.collection("posts").doc(id).update({
    title: document.getElementById("editTitle").value,
    description: document.getElementById("editDesc").value
})
.then(() => {
    alert("Post updated!");
});

}

function deletePost() {

let id = document.getElementById("deleteSelect").value;

if (!id) {
    alert("No post selected");
    return;
}

if (!confirm("Delete this post?")) {
    return;
}

db.collection("posts").doc(id).delete()
.then(() => {
    alert("Post deleted!");
})
.catch(err => {
    alert(err.message);
});

}loadPosts();



</script>
</body>
</html>
