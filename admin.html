<!doctype html>
<html>
  <head>
    <title>REAL PESKY ADMIN PANEL</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

    <link rel="stylesheet" href="css/admin.css" />
    <style>
      /* Hide panel until login */
      #panel {
        display: none;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>REAL PESKY ADMIN PANEL</h1>
    </header>

    <!-- LOGIN -->
    <div class="login-box">
      <h2>Admin Login</h2>
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button onclick="loginUser()">Login</button>
    </div>

    <!-- PANEL (hidden until login) -->
    <div id="panel">
      <h2>Create Post</h2>
      <input type="text" id="title" placeholder="Title" />
      <textarea id="desc" placeholder="Description"></textarea>

      <select id="category">
        <option>Football News</option>
        <option>Transfer News</option>
        <option>Match Reports</option>
        <option>Match Prediction</option>
        <option>Trending News</option>
      </select>

      <input type="file" id="imageFile" accept="image/*" />
      <input type="file" id="videoFile" />
      <button id="publishBtn" onclick="createPost()">Publish Post</button>

      <div class="card">
        <h2>Edit Post</h2>
        <select id="editSelect"></select>
        <input type="text" id="editTitle" placeholder="Update Title" />
        <textarea id="editDesc" placeholder="Update Description"></textarea>
        <button onclick="updatePost()">Update Post</button>
      </div>

      <div class="card">
        <h2>Delete Post</h2>
        <select id="deleteSelect"></select>
        <button onclick="deletePost()">Delete Post</button>
      </div>
    </div>

    <script>
      /* Firebase Config */
      const firebaseConfig = {
        apiKey: "AIzaSyChAU1MnZxKB0PPdRZLaWvEWXkqYDl-qKU",
        authDomain: "real-pesky.firebaseapp.com",
        projectId: "real-pesky",
        storageBucket: "real-pesky.appspot.com",
        messagingSenderId: "629793050464",
        appId: "1:629793050464:web:30fe462acfe0e71c605805",
      };

      firebase.initializeApp(firebaseConfig);

      const db = firebase.firestore();
      const storage = firebase.storage();

      /* LOGIN */
      function loginUser() {
        firebase.auth().signInWithEmailAndPassword(
          document.getElementById("email").value,
          document.getElementById("password").value
        )
        .then(() => {
          alert("Login successful");
          document.querySelector(".login-box").style.display = "none";
          document.getElementById("panel").style.display = "block";
        })
        .catch((err) => alert(err.message));
      }
    </script>

    <script src="javascript/admin.js"></script>
  </body>
</html>
